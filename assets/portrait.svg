<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Abstract portrait placeholder">
  <defs>
    <clipPath id="round"><circle cx="320" cy="320" r="320"/></clipPath>
    <mask id="bust">
      <rect width="640" height="640" fill="#000"/>
      <circle cx="320" cy="248" r="103" fill="#fff"/>
      <path d="M108 640c14-172 108-250 212-250s198 78 212 250z" fill="#fff"/>
    </mask>
    <radialGradient id="amb" cx="50%" cy="34%" r="62%">
      <stop offset="0" stop-color="#1A1636"/>
      <stop offset="1" stop-color="#08080A"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="640" height="640" fill="url(#amb)"/>
    <circle cx="320" cy="248" r="150" fill="#6D5BFF" opacity=".16"/>
    <circle cx="320" cy="248" r="96"  fill="#8E82FF" opacity=".14"/>

    <!-- scanline bust -->
