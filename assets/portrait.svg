      <!-- cyan sweep across the crown -->
      <g stroke="#46E3DC" stroke-width="3">
        <line x1="0" y1="184" x2="640" y2="184" opacity=".34"/>
        <line x1="0" y1="198" x2="640" y2="198" opacity=".46"/>
        <line x1="0" y1="212" x2="640" y2="212" opacity=".30"/>
