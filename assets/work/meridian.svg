<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Meridian — warped modular grid study">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0D1B"/>
      <stop offset="1" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="m-hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D5BFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#46E3DC" stop-opacity=".2"/>
    </linearGradient>
    <mask id="m-fade">
      <radialGradient id="m-mg" cx="52%" cy="52%" r="62%">
        <stop offset="0"   stop-color="#fff"/>
        <stop offset="1"   stop-color="#000"/>
      </radialGradient>
      <rect width="1600" height="1000" fill="url(#m-mg)"/>
    </mask>
  </defs>

  <rect width="1600" height="1000" fill="#0B0B0D"/>
  <rect width="1600" height="1000" fill="url(#m-bg)"/>

  <g mask="url(#m-fade)">
    <!-- verticals, each warped by a phase-shifted wave -->
    <g fill="none" stroke="#8E82FF" stroke-width="1" opacity=".34">
      <path d="M60 0C100 250 20 500 60 750C84 880 44 940 60 1000"/>
      <path d="M160 0C200 250 120 500 160 750C184 880 144 940 160 1000"/>
      <path d="M260 0C300 250 220 500 260 750C284 880 244 940 260 1000"/>
      <path d="M360 0C400 250 320 500 360 750C384 880 344 940 360 1000"/>
      <path d="M460 0C500 250 420 500 460 750C484 880 444 940 460 1000"/>
      <path d="M560 0C600 250 520 500 560 750C584 880 544 940 560 1000"/>
      <path d="M660 0C700 250 620 500 660 750C684 880 644 940 660 1000"/>
      <path d="M760 0C800 250 720 500 760 750C784 880 744 940 760 1000"/>
      <path d="M860 0C900 250 820 500 860 750C884 880 844 940 860 1000"/>
      <path d="M960 0C1000 250 920 500 960 750C984 880 944 940 960 1000"/>
      <path d="M1060 0C1100 250 1020 500 1060 750C1084 880 1044 940 1060 1000"/>
      <path d="M1160 0C1200 250 1120 500 1160 750C1184 880 1144 940 1160 1000"/>
      <path d="M1260 0C1300 250 1220 500 1260 750C1284 880 1244 940 1260 1000"/>
      <path d="M1360 0C1400 250 1320 500 1360 750C1384 880 1344 940 1360 1000"/>
      <path d="M1460 0C1500 250 1420 500 1460 750C1484 880 1444 940 1460 1000"/>
      <path d="M1560 0C1600 250 1520 500 1560 750C1584 880 1544 940 1560 1000"/>
    </g>

    <!-- horizontals -->
    <g stroke="#8E82FF" stroke-width="1" opacity=".22">
      <line x1="0" y1="120" x2="1600" y2="120"/>
      <line x1="0" y1="228" x2="1600" y2="228"/>
      <line x1="0" y1="336" x2="1600" y2="336"/>
      <line x1="0" y1="444" x2="1600" y2="444"/>
      <line x1="0" y1="552" x2="1600" y2="552"/>
      <line x1="0" y1="660" x2="1600" y2="660"/>
      <line x1="0" y1="768" x2="1600" y2="768"/>
      <line x1="0" y1="876" x2="1600" y2="876"/>
    </g>

    <!-- highlighted module row -->
    <g fill="none" stroke="url(#m-hot)" stroke-width="1.6" opacity=".85">
      <path d="M660 0C700 250 620 500 660 750C684 880 644 940 660 1000"/>
      <path d="M960 0C1000 250 920 500 960 750C984 880 944 940 960 1000"/>
      <line x1="0" y1="336" x2="1600" y2="336"/>
    </g>
    <rect x="660" y="336" width="300" height="108" fill="#6D5BFF" opacity=".13"/>
    <rect x="660" y="336" width="300" height="108" fill="none" stroke="#46E3DC" stroke-width="1" opacity=".55"/>
  </g>

  <!-- measurement scale along the bottom -->
  <g stroke="#F2F0ED" stroke-width="1" opacity=".28">
    <line x1="660" y1="944" x2="660" y2="964"/>
    <line x1="960" y1="944" x2="960" y2="964"/>
    <line x1="660" y1="958" x2="960" y2="958"/>
  </g>
  <text x="762" y="990" font-family="monospace" font-size="14" letter-spacing="3" fill="#F2F0ED" opacity=".38">300 × 108</text>

  <g stroke="#F2F0ED" stroke-width="1.2" opacity=".16" fill="none">
    <path d="M40 74V40h34"/><path d="M1526 40h34v34"/>
    <path d="M1560 926v34h-34"/><path d="M74 960H40v-34"/>
  </g>
  <g font-family="monospace" font-size="15" letter-spacing="4" fill="#F2F0ED" opacity=".32">
    <text x="40" y="944">FIG. 003</text>
    <text x="1360" y="76">GRID / 16 × 8</text>
  </g>
</svg>
